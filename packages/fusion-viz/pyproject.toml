[project]
name = "fusion-viz"
version = "0.1.0"
description = "Visualize multimodal dataset samples, as a library and as a CLI"
readme = "README.md"
authors = [
    { name = "aidan138", email = "126530615+aidan138@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fusion-core",
    "fusion-datasets",
    "matplotlib>=3.9",
    "typer>=0.15",
]

[project.scripts]
fusion-viz = "fusion_viz.cli:main"

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
fusion-core = { workspace = true }
fusion-datasets = { workspace = true }
